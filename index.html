<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Text Summarizer</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

<style>
body {
  background: #0b1320;
  color: #e5e7eb;
  font-family: Inter, system-ui, sans-serif;
}

.card {
  border-radius: 16px;
  border: none;
}

textarea {
  resize: none;
}

.gradient-btn {
  background: linear-gradient(135deg, #6a11cb, #2575fc);
  border: none;
  color: #fff;
}

.gradient-btn:hover {
  opacity: 0.9;
}

.gradient-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.output-card {
  background: #111827;
  border-left: 4px solid #3b82f6;
  color: #ffffff;
}

.section-title {
  color: #93c5fd;
  font-weight: 600;
  margin: 20px 0 10px;
}

/* MAIN TOPIC */
.main-topic {
  background: #020617;
  border: 1px solid #1e293b;
  border-radius: 12px;
  padding: 16px;
}

.main-topic ul {
  padding-left: 18px;
  margin-bottom: 0;
}

.main-topic li {
  margin-bottom: 8px;
  line-height: 1.6;
}

/* IMPORTANT TOPICS */
.topic-card {
  background: #020617;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  border: 1px solid #1e293b;
}

.topic-title {
  color: #60a5fa;
  font-weight: 600;
}

.topic-text {
  margin-top: 6px;
  line-height: 1.6;
}
</style>
</head>

<body>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-9">

      <h2 class="text-center mb-2">🧠 Text Summarizer</h2>
      <p class="text-center text-secondary mb-4">
        Extract only the most important meaning from long text using AI
      </p>

      <!-- INPUT -->
      <div class="card bg-dark p-4 mb-4">
        <label class="form-label fw-semibold">Input Text</label>

        <textarea
          id="inputText"
          class="form-control bg-black text-white"
          rows="6"
          maxlength="1000"
          placeholder="Paste your text here (max 1000 characters)..."
        ></textarea>

        <!-- CHAR COUNT BELOW INPUT -->
        <small id="charCount" class="d-block mt-1 text-secondary">
          0 / 1000 characters
        </small>

        <div class="d-flex justify-content-end mt-3">
          <button
            id="analyzeBtn"
            class="btn btn-sm gradient-btn"
            onclick="summarize()"
            disabled
          >
            Analyze
          </button>
        </div>
      </div>

      <!-- LOADER -->
      <div id="loader" class="text-center my-4 d-none">
        <div class="spinner-border text-primary"></div>
        <p class="mt-2">Processing text...</p>
      </div>

      <!-- OUTPUT -->
      <div id="output" class="card output-card p-4 d-none">
        <h5 class="mb-3">📌 Analysis Result</h5>
        <div id="result"></div>
      </div>

    </div>
  </div>
</div>

<script>
const WEBHOOK_URL =
  "https://frank2007.app.n8n.cloud/webhook/0718e8c7-cd77-4361-83d9-937646e018fa";

const input = document.getElementById("inputText");
const charCount = document.getElementById("charCount");
const analyzeBtn = document.getElementById("analyzeBtn");

const MAX_CHARS = 1000;

input.addEventListener("input", () => {
  const length = input.value.length;
  charCount.textContent = `${length} / ${MAX_CHARS} characters`;

  if (length === 0||length>=1000) {
    analyzeBtn.disabled = true;
  } else {
    analyzeBtn.disabled = false;
  }

  if (length >= MAX_CHARS) {
    charCount.classList.replace("text-secondary", "text-danger");
  } else {
    charCount.classList.replace("text-danger", "text-secondary");
  }
});

async function summarize() {
  const text = input.value.trim();
  if (!text) return;

  document.getElementById("loader").classList.remove("d-none");
  document.getElementById("output").classList.add("d-none");

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text })
    });

    const data = await res.json();
    const rawText = data?.[0]?.output || "";
    renderOutput(rawText);

    document.getElementById("output").classList.remove("d-none");
  } catch (err) {
    alert("Failed to fetch response");
  } finally {
    document.getElementById("loader").classList.add("d-none");
  }
}

function renderOutput(text) {
  const lines = text
    .split("\n")
    .map(l => l.trim())
    .filter(Boolean);

  let mode = "";
  const mainTopic = [];
  const importantTopics = [];

  lines.forEach(line => {
    if (line.toLowerCase().startsWith("main topic")) {
      mode = "main";
      return;
    }
    if (line.toLowerCase().startsWith("important topics")) {
      mode = "important";
      return;
    }
    if (line.startsWith("-")) {
      const content = line.replace(/^-\s*/, "");
      if (mode === "main") mainTopic.push(content);
      if (mode === "important") importantTopics.push(content);
    }
  });

  let html = "";

  if (mainTopic.length) {
    html += `<div class="section-title">Main Topic</div>`;
    html += `<div class="main-topic"><ul>`;
    mainTopic.forEach(p => html += `<li>${p}</li>`);
    html += `</ul></div>`;
  }

  if (importantTopics.length) {
    html += `<div class="section-title">Important Topics</div>`;
    importantTopics.forEach(item => {
      const [title, ...rest] = item.split(":");
      html += `
        <div class="topic-card">
          <div class="topic-title">${title.trim()}</div>
          <div class="topic-text">${rest.join(":").trim()}</div>
        </div>
      `;
    });
  }

  document.getElementById("result").innerHTML =
    html || "<p>No data available</p>";
}
</script>
</body>
</html>
